[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-drone"
version = "0.1.0"
description = "Pure Python implementation of Gazebo Transport for easy drone communication"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Easy Drone Contributors"}
]
keywords = ["gazebo", "drone", "robotics", "transport", "pubsub", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Robotics",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyzmq>=25.0.0",
    "protobuf>=4.25.0",  # Requires runtime_version support
]

[project.optional-dependencies]
zenoh = ["eclipse-zenoh"]
yolo = [
    "opencv-python>=4.5.0",
    "numpy>=1.21.0",
    "onnxruntime>=1.12.0",
    "matplotlib>=3.5.0",
]
all = ["easy-drone[zenoh,yolo]"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "mypy-protobuf>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/TensorFleet/easy-drone-python"
Documentation = "https://github.com/TensorFleet/easy-drone-python#readme"
Repository = "https://github.com/TensorFleet/easy-drone-python"
Issues = "https://github.com/TensorFleet/easy-drone-python/issues"

[tool.setuptools]
packages = ["gz_transport", "gz"]
include-package-data = true

[tool.setuptools.package-data]
"gz.msgs" = ["*.py", "*.pyi"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

